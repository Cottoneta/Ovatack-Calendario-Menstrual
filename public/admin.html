<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel del Administrador - Girly Blog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #ffe6f2;
      font-family: 'Montserrat', sans-serif;
      padding-top: 80px;
    }

    .navbar-custom {
      background-color: #ff69b4 !important;
    }

    .comment__card {
      background-color: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .comment__meta strong {
      color: #f76c66;
    }

    .act {
      border: none;
      background: none;
      cursor: pointer;
      font-weight: 600;
    }

    .act--delete {
      color: #dc3545;
    }

    .act--like {
      color: #f76c66;
    }

    .comments__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
      margin-bottom: 15px;
    }

    .comments__title {
      color: #f76c66;
      font-weight: bold;
    }

    .comments__count {
      background-color: #f76c66;
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#" style="font-weight: bold;">
      <img src="img/VA.png" width="70" height="50" alt="OvaTack" style="vertical-align: middle;"> OvaTack - Admin
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-center" id="menuNav">
      <ul class="navbar-nav">
       <li class="nav-item"><a class="nav-link" href="/admin">Blog</a></li>
        <li class="nav-item"><a class="nav-link active" href="/admintips">Tips</a></li>
      </ul>
    </div>

    <ul class="navbar-nav ms-auto">
      <li class="nav-item dropdown">
        <a id="user-link" class="nav-link dropdown-toggle fw-bold" href="#" role="button" data-bs-toggle="dropdown">Administrador</a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a id="logout-link" class="dropdown-item text-danger fw-bold" href="#">Cerrar sesión</a></li>
        </ul>
      </li>
    </ul>
  </div>
</nav>

<h2 class="text-center fw-bold mt-5" style="color: #f76c66;">Panel del Administrador</h2>

<div class="ctn-data d-flex flex-column align-items-center justify-content-center" style="min-height: 30vh;"> 
  <h3 class="mt-3 text-center">Gestión de comentarios del blog</h3> 
  <p class="text-center">Aquí puedes revisar y eliminar cualquier comentario publicado por los usuarios.</p>
</div>

<main class="container">
  <section class="comments">
    <header class="comments__header">
      <h1 class="comments__title">Todos los comentarios</h1>
      <span class="comments__count" aria-label="Cantidad de comentarios">0</span>
    </header>

    <ol class="thread list-unstyled" role="list"></ol>
  </section>
</main>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  //Verifica rol administrador
  const rol = localStorage.getItem("rol");
  if (rol !== "admin") {
    alert("Acceso restringido solo para el administrador.");
    window.location.href = "/index.html";
    return;
  }

  const thread = document.querySelector(".thread");
  const countEl = document.querySelector(".comments__count");

  
  function makeCommentHTML({ id, autor, iniciales, texto, fecha, likes = 0 }) {
    const escapeHTML = (str) =>
      (str ?? "").replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    return `
      <article class="comment__card">
        <div class="comment__content">
          <header class="comment__meta">
            <strong>${escapeHTML(autor)}</strong>
            <time datetime="${fecha}">${new Date(fecha).toLocaleString()}</time>
          </header>
          <p>${escapeHTML(texto)}</p>
          <footer class="comment__actions">
            <button class="act act--like" data-action="like" type="button">❤️ <span class="like-count">${likes}</span></button>
            <button class="act act--delete text-danger" data-action="delete" type="button">Eliminar</button>
          </footer>
        </div>
      </article>`;
  }

  //Cargar comentarios desde el servidor
  async function cargarComentarios() {
    const res = await fetch("/api/comentarios");
    const data = await res.json();
    thread.innerHTML = "";
    data.forEach(c => {
      const li = document.createElement("li");
      li.className = "comment";
      li.dataset.id = c.id;
      li.innerHTML = makeCommentHTML(c);
      thread.prepend(li);
    });
    countEl.textContent = data.length;
  }

  //Eliminar comentario
  async function eliminarComentario(id) {
    if (!confirm("¿Seguro que deseas eliminar este comentario?")) return;
    await fetch(`/api/comentarios/${id}`, { method: "DELETE" });
    await cargarComentarios();
  }

  //Dar like (no se usa en admin y tampoco sirve)
  async function darLike(id, btn) {
    const res = await fetch(`/api/comentarios/${id}/like`, { method: "POST" });
    const data = await res.json();
    const countSpan = btn.querySelector(".like-count");
    if (countSpan && data.likes !== undefined) {
      countSpan.textContent = data.likes;
    }
  }

  thread.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;
    const commentEl = btn.closest(".comment");
    const id = commentEl.dataset.id;

    if (action === "delete") await eliminarComentario(id);
    if (action === "like") await darLike(id, btn);
  });

  await cargarComentarios();

  //Cerrar sesión
  document.getElementById("logout-link").addEventListener("click", (event) => {
    event.preventDefault();
    localStorage.clear();
    alert("Sesión cerrada correctamente.");
  window.location.href = "/";

  });
});
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
