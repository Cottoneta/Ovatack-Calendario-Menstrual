<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OvatackNew</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fff, #ffe6f0);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .contenedor {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(233, 30, 99, 0.2);
      width: 320px;
      text-align: center;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #e91e63;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #f8bbd0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #e91e63;
      box-shadow: 0 0 8px rgba(233, 30, 99, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #e91e63;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #d81b60;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(233, 30, 99, 0.4);
    }

    .link {
      margin-top: 12px;
      font-size: 14px;
    }

    .link a {
      color: #e91e63;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .link a:hover {
      text-decoration: underline;
    }

    .mensaje-estado {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid transparent;
      animation: fadeIn 0.4s ease-in-out;
    }

    .mensaje-exito {
      background-color: #e8f5e9;
      border-color: #81c784;
      color: #2e7d32;
      box-shadow: 0 0 8px rgba(129, 199, 132, 0.4);
    }

    .mensaje-error {
      background-color: #ffebee;
      border-color: #e57373;
      color: #c62828;
      box-shadow: 0 0 8px rgba(229, 115, 115, 0.4);
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- 🔹 Formulario de login -->
    <div class="contenedor" id="form-login">
      <h2>Iniciar Sesión</h2>
      <form id="formulario-login">
        <input type="email" id="log-email" placeholder="Email" required>
        <input type="password" id="log-password" placeholder="Password" required>
        <button type="submit">Entrar</button>
      </form>
      <p class="link">¿No tienes cuenta? <a onclick="mostrarRegistro()">Regístrate aquí</a></p>
    </div>

    <!-- 🔹 Formulario de registro -->
    <div class="contenedor" id="form-registro" style="display: none;">
      <h2>Registro Usuario</h2>
      <form id="formulario-registro">
        <input type="text" id="reg-username" placeholder="Username" required>
        <input type="password" id="reg-password" placeholder="Password" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <button type="submit">Registrarse</button>
      </form>
      <p class="link">¿Ya tienes cuenta? <a onclick="mostrarLogin()">Inicia sesión</a></p>
    </div>

    <div id="mensaje" class="mensaje-estado"></div>
  </div>

  <!-- 🔹 Scripts -->
  <script>
    function mostrarRegistro() {
      document.getElementById("form-login").style.display = "none";
      document.getElementById("form-registro").style.display = "block";
    }

    function mostrarLogin() {
      document.getElementById("form-registro").style.display = "none";
      document.getElementById("form-login").style.display = "block";
    }
  </script>

  <!-- 🔹 App principal -->
  <script>
  const API_URL = 'http://localhost:3000';

  const registerForm = document.getElementById('formulario-registro');
  const loginForm = document.getElementById('formulario-login');
  const mensaje = document.getElementById('mensaje');

  function mostrarMensaje(texto, tipo) {
    mensaje.textContent = texto;
    mensaje.className = 'mensaje-estado ' + (tipo === 'exito' ? 'mensaje-exito' : 'mensaje-error');
    setTimeout(() => {
      mensaje.textContent = '';
      mensaje.className = 'mensaje-estado';
    }, 4000);
  }

  // 🔹 Registro normal
  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('reg-username').value;
    const password = document.getElementById('reg-password').value;
    const email = document.getElementById('reg-email').value;

    const res = await fetch(`${API_URL}/registrar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, email }),
    });

    const data = await res.json();
    if (res.ok) {
      mostrarMensaje('Registro exitoso', 'exito');
      registerForm.reset();
      mostrarLogin();
    } else {
      mostrarMensaje(data.error || 'Error al registrar usuario', 'error');
    }
  });

  // 🔹 Login con soporte admin
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('log-email').value;
    const password = document.getElementById('log-password').value;

    const res = await fetch(`${API_URL}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });

    const data = await res.json();

    if (res.ok) {
      mostrarMensaje(data.message || 'Inicio de sesión exitoso', 'exito');

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      localStorage.setItem('usuarioActivo', data.user.username);
      localStorage.setItem('rol', data.role);

      loginForm.reset();

      // 🔹 Redirigir según rol
      setTimeout(() => {
        if (data.role === 'admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/usuario';
        }
      }, 1200);
    } else {
      mostrarMensaje(data.error || 'Error al iniciar sesión', 'error');
    }
  });

  // 🔹 Verificar si ya hay sesión activa
  window.addEventListener('DOMContentLoaded', () => {
    const rol = localStorage.getItem('rol');
    if (rol === 'admin') {
      window.location.href = '/admin';
    } else if (rol === 'usuario') {
      window.location.href = '/usuario';
    }
  });
  </script>
</body>
</html>
